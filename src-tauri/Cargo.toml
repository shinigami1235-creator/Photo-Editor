[package]
name = "photo-editor"
version = "0.2.0"
description = "Photo Editor"
edition = "2021"

[lib]
name = "photo_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fontdb = "0.23"
percent-encoding = "2"
