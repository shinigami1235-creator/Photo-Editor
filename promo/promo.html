<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Cinzel; font-weight: 400; src: url(fonts/cinzel-latin-400-normal.woff2); }
@font-face { font-family: Cinzel; font-weight: 700; src: url(fonts/cinzel-latin-700-normal.woff2); }
@font-face { font-family: Plex; font-weight: 400; src: url(fonts/ibm-plex-sans-latin-400-normal.woff2); }
@font-face { font-family: Plex; font-weight: 600; src: url(fonts/ibm-plex-sans-latin-600-normal.woff2); }
@font-face { font-family: Plex; font-weight: 700; src: url(fonts/ibm-plex-sans-latin-700-normal.woff2); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4;
const NAVY = '#101c2b', NAVY2 = '#16263a', GOLD = '#e0b45a', GOLD2 = '#c89a3c', BLUE = '#1f5e99', SKY = '#4f9be0', WHITE = '#ffffff', MIST = '#cfd5de', PINK = '#ff5d8f';

// ---------- assets ----------
const NAMES = ['beach-small.jpg', 'beach-up4.png', 'coffee-cocoa.png', 'coffee-orig.png', 'hat-orig.png', 'hat-shift.png', 'kids-orig.png', 'kids-styled.png', 'layer-0.png', 'layer-1.png', 'layer-2.png', 'layer-3.png', 'layer-4.png', 'night-fixed.png', 'night-orig.jpg', 'pano.jpg', 'post-1.png', 'post-2.png', 'post-3.png', 'sushi-cut.png', 'sushi-orig.jpg', 'ui-layers.png', 'ui-search.png', 'ui-batch.png', 'logo.svg'];
const IMG = {};
window.ready = Promise.all([
  ...NAMES.map((n) => new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[n.split('.')[0]] = i; res(); }; i.onerror = () => rej(n); i.src = 'assets/' + n; })),
  document.fonts.load('700 40px Cinzel'), document.fonts.load('400 40px Cinzel'), document.fonts.load('700 40px Plex'), document.fonts.load('600 40px Plex'), document.fonts.load('400 40px Plex'),
]);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const eOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eOutCubic = (x) => 1 - Math.pow(1 - x, 3);
const eIn = (x) => x * x * x;
const b2t = (bar, beat = 0) => bar * BAR + beat * BEAT;
function rand(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function font(size, weight = 700, fam = 'Plex') { ctx.font = `${weight} ${size}px ${fam}`; }
function cover(img, x, y, w, h, zoom = 1, ox = 0.5, oy = 0.5) {
  const s = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * s, ih = img.height * s;
  ctx.drawImage(img, x + (w - iw) * ox, y + (h - ih) * oy, iw, ih);
}
function contain(img, x, y, w, h) {
  const s = Math.min(w / img.width, h / img.height);
  const iw = img.width * s, ih = img.height * s;
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
  return { x: x + (w - iw) / 2, y: y + (h - ih) / 2, w: iw, h: ih };
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function shadowOn(blur = 40, col = 'rgba(0,0,0,0.45)', oy = 18) { ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy; }
function shadowOff() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function checker(x, y, w, h, s = 22) {
  ctx.save(); rr(x, y, w, h, 0); ctx.clip();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#e3e7ee';
  for (let yy = 0; yy < h; yy += s) for (let xx = (yy / s) % 2 ? s : 0; xx < w; xx += 2 * s) ctx.fillRect(x + xx, y + yy, s, s);
  ctx.restore();
}
// Beat pulse: 1 on each beat, decaying.
function pulse(t, k = 9) { const p = ((t % BEAT) + BEAT) % BEAT; return Math.exp(-p * k); }
const inDrop = (t) => (t >= b2t(4) && t < b2t(16)) || (t >= b2t(18) && t < b2t(30));

// Pop-in text: scales from small with a back ease, slides up.
function pop(text, x, y, size, t0, t, { weight = 700, fam = 'Plex', color = WHITE, align = 'left', dur = 0.35, stroke = null } = {}) {
  const p = prog(t, t0, t0 + dur); if (p <= 0) return 0;
  const s = eOutBack(p);
  ctx.save(); ctx.globalAlpha *= clamp(p * 2.5);
  ctx.translate(x, y + (1 - eOutExpo(p)) * size * 0.6); ctx.scale(lerp(0.6, 1, s), lerp(0.6, 1, s));
  font(size, weight, fam); ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (stroke) { ctx.lineWidth = stroke[1]; ctx.strokeStyle = stroke[0]; ctx.strokeText(text, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(text, 0, 0);
  ctx.restore();
  return ctx.measureText(text).width;
}
// Words rise one after another.
function words(list, x, y, size, t0, t, { gap = 0.12, weight = 700, fam = 'Plex', colors = [], align = 'left', space = 0.28 } = {}) {
  font(size, weight, fam);
  const widths = list.map((w) => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + size * space * (list.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  list.forEach((w, i) => {
    const p = prog(t, t0 + i * gap, t0 + i * gap + 0.4);
    if (p > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - 20, y - size * 1.1, widths[i] + 40, size * 1.45); ctx.clip();
      font(size, weight, fam); ctx.textAlign = 'left'; ctx.fillStyle = colors[i] || WHITE; ctx.globalAlpha *= clamp(p * 3);
      ctx.fillText(w, cx, y + (1 - eOutExpo(p)) * size * 1.2);
      ctx.restore();
    }
    cx += widths[i] + size * space;
  });
  return total;
}
function chipRow(list, cy, t0, t, step, styleFor) {
  font(28, 700); const ws = list.map((c) => ctx.measureText(c).width + 28 * 1.2), gap = 28, tot = ws.reduce((a, b) => a + b) + gap * (list.length - 1);
  let x = W / 2 - tot / 2;
  list.forEach((c, i) => { chip(c, x + ws[i] / 2, cy, t0 + i * step, t, { ...styleFor(i), size: 28, align: 'center' }); x += ws[i] + gap; });
}
function chip(text, x, y, t0, t, { bg = GOLD, fg = NAVY, size = 30, align = 'left' } = {}) {
  const p = prog(t, t0, t0 + 0.3); if (p <= 0) return;
  font(size, 700); const w = ctx.measureText(text).width + size * 1.2, h = size * 1.7;
  const s = eOutBack(p);
  ctx.save(); ctx.translate(align === 'center' ? x : x + w / 2, y); ctx.scale(s, s); ctx.globalAlpha *= clamp(p * 3);
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 2);
  ctx.restore();
}
// Underline swoosh under a word.
function swoosh(x, y, w, t0, t, color = GOLD, lw = 12) {
  const p = eOutExpo(prog(t, t0, t0 + 0.45)); if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + w * 0.5, y + 16, x + w * p, y - 4); ctx.stroke(); ctx.restore();
}
// Hand-drawn circle around a point of interest.
function ring(x, y, rx, ry, t0, t, color = GOLD, lw = 8) {
  const p = eOutCubic(prog(t, t0, t0 + 0.5)); if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, -0.08, -Math.PI * 0.6, -Math.PI * 0.6 + Math.PI * 2.15 * p); ctx.stroke(); ctx.restore();
}
function arrow(x1, y1, x2, y2, t0, t, color = GOLD, lw = 8) {
  const p = eOutCubic(prog(t, t0, t0 + 0.4)); if (p <= 0) return;
  const mx = (x1 + x2) / 2 + (y2 - y1) * 0.25, my = (y1 + y2) / 2 - (x2 - x1) * 0.25;
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1);
  const n = 30; let px = x1, py = y1, qx = x1, qy = y1;
  for (let i = 1; i <= n * p; i++) { const u = i / n; qx = px; qy = py; px = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * mx + u * u * x2; py = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * my + u * u * y2; ctx.lineTo(px, py); }
  ctx.stroke();
  if (p > 0.95) { const a = Math.atan2(py - qy, px - qx); ctx.beginPath(); ctx.moveTo(px + Math.cos(a) * 10, py + Math.sin(a) * 10); ctx.lineTo(px + Math.cos(a + 2.5) * 30, py + Math.sin(a + 2.5) * 30); ctx.lineTo(px + Math.cos(a - 2.5) * 30, py + Math.sin(a - 2.5) * 30); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function shape(kind, x, y, s, rot, color, lw = 6) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  if (kind === 'ring') { ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.stroke(); }
  else if (kind === 'dot') { ctx.arc(0, 0, s * 0.35, 0, Math.PI * 2); ctx.fill(); }
  else if (kind === 'tri') { for (let i = 0; i < 3; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 3; ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s); } ctx.closePath(); ctx.stroke(); }
  else if (kind === 'plus') { ctx.moveTo(-s, 0); ctx.lineTo(s, 0); ctx.moveTo(0, -s); ctx.lineTo(0, s); ctx.stroke(); }
  else if (kind === 'square') { ctx.rect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6); ctx.stroke(); }
  else if (kind === 'zig') { for (let i = 0; i <= 6; i++) ctx.lineTo(-s * 1.4 + i * s * 0.47, i % 2 ? -s * 0.3 : s * 0.3); ctx.stroke(); }
  else if (kind === 'star') { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.45 : s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
// Burst of rays and shapes at a hit.
function burst(x, y, t0, t, { n = 14, r = 260, color = GOLD, seed = 1 } = {}) {
  const p = prog(t, t0, t0 + 0.7); if (p <= 0 || p >= 1) return;
  const R = rand(seed);
  ctx.save(); ctx.globalAlpha *= 1 - p;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + R() * 0.3, d = r * eOutExpo(p) * (0.7 + R() * 0.6);
    const kinds = ['dot', 'plus', 'tri', 'ring', 'star'];
    shape(kinds[i % kinds.length], x + Math.cos(a) * d, y + Math.sin(a) * d, 10 + R() * 14, a + p * 3, i % 3 ? color : WHITE, 4);
  }
  ctx.strokeStyle = color; ctx.lineWidth = 6 * (1 - p); ctx.beginPath(); ctx.arc(x, y, r * 0.9 * eOutExpo(p), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// ---------- background ----------
const R0 = rand(42);
const FLOAT = Array.from({ length: 34 }, () => ({ x: R0() * W, y: R0() * H, s: 8 + R0() * 26, k: ['ring', 'plus', 'tri', 'dot', 'square', 'zig'][Math.floor(R0() * 6)], sp: 10 + R0() * 40, rot: R0() * 6, vr: (R0() - 0.5) * 1.2, c: R0() < 0.55 ? GOLD : R0() < 0.5 ? SKY : MIST, z: 0.4 + R0() * 0.8 }));
function background(t, { light = false } = {}) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  if (light) { g.addColorStop(0, '#f4efe4'); g.addColorStop(1, '#e6ecf4'); }
  else { g.addColorStop(0, '#0c1624'); g.addColorStop(0.55, NAVY); g.addColorStop(1, '#13304f'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // moving grid
  ctx.save(); ctx.strokeStyle = light ? 'rgba(16,28,43,0.06)' : 'rgba(255,255,255,0.045)'; ctx.lineWidth = 2;
  const off = (t * 40) % 80;
  for (let x = -80 + off; x < W + 80; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = -80 + off; y < H + 80; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // glow blobs
  const bp = inDrop(t) ? pulse(t, 6) : 0;
  for (const [cx, cy, col, r] of [[W * 0.85 + Math.sin(t * 0.6) * 80, H * 0.2, light ? 'rgba(224,180,90,0.25)' : 'rgba(224,180,90,0.16)', 520], [W * 0.1, H * 0.9 + Math.cos(t * 0.5) * 60, light ? 'rgba(79,155,224,0.22)' : 'rgba(31,94,153,0.35)', 620]]) {
    const gg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * (1 + bp * 0.08));
    gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  }
  // floating shapes
  ctx.save();
  for (const f of FLOAT) {
    const y = ((f.y - t * f.sp * f.z) % (H + 100) + H + 100) % (H + 100) - 50;
    ctx.globalAlpha = (light ? 0.35 : 0.28) * f.z * (1 + bp * 0.8);
    shape(f.k, f.x, y, f.s * (1 + bp * 0.25), f.rot + t * f.vr, f.c, 3);
  }
  ctx.restore();
}

// Scene title block used by every feature.
function featureTitle(t, t0, num, kicker, line1, line2, sub) {
  chip(`${String(num).padStart(2, '0')} / 11`, 120, 250, t0 + 0.05, t, { bg: 'rgba(255,255,255,0.1)', fg: GOLD, size: 26 });
  pop(kicker, 120, 340, 34, t0 + 0.1, t, { weight: 600, color: SKY });
  font(100, 700, 'Cinzel'); const widest = Math.max(ctx.measureText(line1).width, line2 ? ctx.measureText(line2).width : 0);
  const fs = Math.min(92, Math.floor(100 * 740 / widest));
  words(line1.split(' '), 120, 450, fs, t0 + 0.18, t, { fam: 'Cinzel', weight: 700 });
  if (line2) words(line2.split(' '), 120, 450 + fs * 1.2, fs, t0 + 0.35, t, { fam: 'Cinzel', weight: 700, colors: line2.split(' ').map(() => GOLD) });
  if (line2) { font(fs, 700, 'Cinzel'); swoosh(120, 450 + fs * 1.6, ctx.measureText(line2).width, t0 + 0.7, t); }
  if (sub) { ctx.save(); ctx.globalAlpha *= clamp((t - t0 - 0.8) * 3); font(36, 400); ctx.fillStyle = MIST; ctx.textAlign = 'left'; wrap(sub, 120, line2 ? 690 : 580, 640, 50); ctx.restore(); }
}
function wrap(text, x, y, maxW, lh) {
  const ws = text.split(' '); let line = '';
  for (const w of ws) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = test; }
  if (line) ctx.fillText(line, x, y);
}
// Card that holds a picture on the right side.
function card(x, y, w, h, t, t0, drawInner, { r = 26, tilt = 0, from = 'right' } = {}) {
  const p = eOutExpo(prog(t, t0, t0 + 0.6)); if (p <= 0) return;
  ctx.save();
  const dx = from === 'right' ? (1 - p) * 500 : from === 'bottom' ? 0 : -(1 - p) * 500, dy = from === 'bottom' ? (1 - p) * 400 : 0;
  ctx.translate(x + w / 2 + dx, y + h / 2 + dy); ctx.rotate(tilt * (1 - p * 0.6)); ctx.globalAlpha *= clamp(p * 2);
  shadowOn(60, 'rgba(0,0,0,0.5)', 30); rr(-w / 2, -h / 2, w, h, r); ctx.fillStyle = '#fff'; ctx.fill(); shadowOff();
  rr(-w / 2, -h / 2, w, h, r); ctx.clip();
  drawInner(-w / 2, -h / 2, w, h);
  ctx.restore();
}

// ---------- scenes ----------
function sHook(t) {
  background(t);
  const T = (bar, beat) => b2t(bar, beat);
  // bar 0: three words on the first three beats
  const L = [['Posts.', WHITE], ['Carousels.', GOLD], ['Flyers.', SKY]];
  if (t < T(1, 3.5)) {
    font(112, 700, 'Cinzel'); const ws = L.map(([w]) => ctx.measureText(w).width), gap = 70, tot = ws.reduce((a, b) => a + b) + gap * 2;
    let cx = W / 2 - tot / 2; const xs = ws.map((w) => { const c = cx + w / 2; cx += w + gap; return c; });
    L.forEach(([w, c], i) => pop(w, xs[i], 520, 112, T(0, i * 1.2), t, { fam: 'Cinzel', color: c, align: 'center' }));
    for (let i = 0; i < 3; i++) burst(xs[i], 480, T(0, i * 1.2), t, { seed: i + 3, r: 200, color: L[i][1] });
    pop('Every single week.', W / 2, 700, 64, T(1, 0.5), t, { weight: 600, color: MIST, align: 'center' });
  }
  // bar 2 to 3: the line grows with the riser
  if (t >= T(1, 3.5) && t < T(3, 0)) {
    const p = prog(t, T(2), T(3, 0));
    ctx.save(); ctx.translate(W / 2, H / 2); const s = 1 + p * 0.25; ctx.scale(s, s);
    words(['What', 'if', 'one', 'app'], 0, -40, 110, T(1, 3.5), t, { fam: 'Cinzel', align: 'center', colors: [WHITE, WHITE, GOLD, GOLD] });
    words(['did', 'all', 'of', 'it?'], 0, 100, 110, T(2, 1), t, { fam: 'Cinzel', align: 'center' });
    ctx.restore();
    // shapes rushing in
    const R = rand(9);
    for (let i = 0; i < 24; i++) { const a = R() * Math.PI * 2, d = lerp(1200, 380, eIn(p)); shape(['tri', 'plus', 'ring', 'square'][i % 4], W / 2 + Math.cos(a) * d, H / 2 + Math.sin(a) * d * 0.6, 14 + R() * 16, a + t * 2, i % 2 ? GOLD : SKY, 4); }
  }
  // countdown on the snare roll
  if (t >= T(3, 2)) {
    const n = t < T(3, 3) ? '2' : '1';
    const k = t < T(3, 3) ? T(3, 2) : T(3, 3);
    pop(n, W / 2, H / 2 + 120, 360, k, t, { fam: 'Cinzel', color: GOLD, align: 'center', dur: 0.2 });
    burst(W / 2, H / 2, k, t, { seed: 11, r: 380 });
  }
  if (t >= T(3, 1) && t < T(3, 2)) { pop('3', W / 2, H / 2 + 120, 360, T(3, 1), t, { fam: 'Cinzel', color: WHITE, align: 'center', dur: 0.2 }); burst(W / 2, H / 2, T(3, 1), t, { seed: 12, r: 380, color: WHITE }); }
  if (t >= T(3, 0) && t < T(3, 1)) pop('Meet', W / 2, H / 2 + 40, 140, T(3, 0), t, { fam: 'Cinzel', align: 'center', dur: 0.2 });
}

function logoBlock(t, t0, cx, cy, size) {
  const p = eOutBack(prog(t, t0, t0 + 0.6));
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((1 - p) * -0.6); ctx.scale(p, p);
  shadowOn(60, 'rgba(224,180,90,0.45)', 0); ctx.drawImage(IMG.logo, -size / 2, -size / 2, size, size); shadowOff();
  ctx.restore();
}
function sLogo(t) {
  background(t);
  const t0 = b2t(4);
  // spinning rings behind the logo
  ctx.save(); ctx.translate(W / 2, 400);
  for (let i = 0; i < 3; i++) {
    const p = eOutExpo(prog(t, t0 + i * 0.08, t0 + 0.8 + i * 0.08));
    ctx.rotate(t * (i % 2 ? -0.5 : 0.4)); ctx.strokeStyle = i === 1 ? SKY : GOLD; ctx.lineWidth = 4; ctx.setLineDash([30 + i * 20, 24]);
    ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(0, 0, (220 + i * 70) * p * (1 + pulse(t, 7) * 0.04), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  burst(W / 2, 400, t0, t, { n: 22, r: 520, seed: 21 });
  logoBlock(t, t0, W / 2, 400, 300);
  const wp = prog(t, t0 + 0.35, t0 + 0.9);
  if (wp > 0) {
    ctx.save(); ctx.globalAlpha = clamp(wp * 2); font(132, 700, 'Cinzel'); ctx.textAlign = 'center';
    const sp = lerp(40, 14, eOutExpo(wp));
    ctx.letterSpacing = sp + 'px';
    const w1 = ctx.measureText('PHOTO ').width, w2 = ctx.measureText('EDITOR').width, x0 = W / 2 - (w1 + w2) / 2;
    ctx.textAlign = 'left'; ctx.fillStyle = WHITE; ctx.fillText('PHOTO ', x0, 720); ctx.fillStyle = GOLD; ctx.fillText('EDITOR', x0 + w1, 720);
    ctx.restore();
  }
  words(['Posts,', 'carousels', 'and', 'flyers', 'on', 'your', 'own', 'computer'], W / 2, 820, 46, t0 + 0.8, t, { weight: 400, align: 'center', gap: 0.06, colors: [MIST, MIST, MIST, MIST, MIST, GOLD, GOLD, GOLD] });
  chipRow(['Windows', 'Mac', 'Works offline'], 930, b2t(5, 1), t, BEAT / 2, (i) => ({ bg: i === 2 ? GOLD : 'rgba(255,255,255,0.12)', fg: i === 2 ? NAVY : WHITE }));
}

  const i = clamp(Math.floor((t - t0) / BEAT), 0, 7);
  const lt = t - (t0 + i * BEAT);
  const [big, small] = items[i];
  const R = rand(100 + i);
  const shapesK = ['ring', 'tri', 'square', 'plus', 'star', 'zig'];
  for (let k = 0; k < 10; k++) { const a = R() * Math.PI * 2, d = 300 + R() * 300 + eOutExpo(clamp(lt * 3)) * 80; shape(shapesK[(k + i) % 6], W / 2 + Math.cos(a) * d * 1.4, H / 2 + Math.sin(a) * d * 0.8, 18 + R() * 30, a + lt * 3, k % 2 ? GOLD : SKY, 5); }
  const s = eOutBack(clamp(lt / 0.18));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.rotate((i % 2 ? 1 : -1) * 0.04);
  font(230, 700, 'Cinzel'); ctx.textAlign = 'center'; ctx.fillStyle = i % 2 ? GOLD : WHITE; ctx.fillText(big, 0, 40);
  font(64, 600); ctx.fillStyle = i % 2 ? WHITE : GOLD; ctx.fillText(small, 0, 150);
  ctx.restore();
  chip(`${i + 1} / 8`, W / 2, 940, t0 + i * BEAT, t, { size: 24, align: 'center', bg: 'rgba(255,255,255,0.12)', fg: WHITE });
  pop('And more', 120, 160, 50, t0, t, { fam: 'Cinzel', color: MIST });
}
function sOutro(t) {
  background(t);
  const t0 = b2t(28);
  burst(W / 2, 380, t0, t, { n: 24, r: 560, seed: 51 });
  logoBlock(t, t0, W / 2, 360, 260);
  ctx.save(); font(124, 700, 'Cinzel'); ctx.textAlign = 'center';
  const a = clamp((t - t0 - 0.3) * 3); ctx.globalAlpha = a;
  ctx.letterSpacing = '14px'; const w1 = ctx.measureText('PHOTO ').width, w2 = ctx.measureText('EDITOR').width, x0 = W / 2 - (w1 + w2) / 2;
  ctx.textAlign = 'left'; ctx.fillStyle = WHITE; ctx.fillText('PHOTO ', x0, 660); ctx.fillStyle = GOLD; ctx.fillText('EDITOR', x0 + w1, 660); ctx.restore();
  words(['Made', 'for', 'clinics', 'and', 'brands'], W / 2, 760, 52, t0 + 0.8, t, { weight: 400, align: 'center', gap: 0.08, colors: [MIST, MIST, GOLD, MIST, GOLD] });
  chipRow(['Windows', 'Mac', 'Works offline', 'No subscription'], 880, b2t(29), t, BEAT / 2, (i) => ({ bg: i % 2 ? GOLD : 'rgba(255,255,255,0.12)', fg: i % 2 ? NAVY : WHITE }));
  pop('Cygnus Solutions', W / 2, 1000, 34, b2t(30), t, { weight: 600, color: MIST, align: 'center' });
  // final hit at bar 31 beat 2
  const fh = b2t(31, 2);
  if (t >= fh) { burst(W / 2, 360, fh, t, { n: 28, r: 700, seed: 52, color: WHITE }); }
}

// ---------- transitions and frame ----------
const FEATURES = [fLayers, fBehind, fCutout, fNight, fColour, fUpscale, fSheet, fPano, fStyles, fLayout, fStats];
function wipe(t, at) {
  const p = prog(t, at - 0.22, at + 0.22); if (p <= 0 || p >= 1) return;
  ctx.save(); ctx.fillStyle = GOLD;
  const x = lerp(-W * 0.6, W * 1.6, eInOut(p));
  ctx.beginPath(); ctx.moveTo(x - 300, 0); ctx.lineTo(x + 500, 0); ctx.lineTo(x + 200, H); ctx.lineTo(x - 600, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = NAVY; ctx.beginPath(); ctx.moveTo(x - 360, 0); ctx.lineTo(x - 300, 0); ctx.lineTo(x - 600, H); ctx.lineTo(x - 660, H); ctx.closePath(); ctx.fill();
  ctx.restore();
}
window.render = function (t) {
  ctx.save();
  // camera shake on the big hits
  let shake = 0;
  for (const hit of [b2t(4), b2t(18), b2t(28), b2t(31, 2)]) shake += Math.max(0, 1 - (t - hit) / 0.35) * (t >= hit ? 1 : 0);
  if (shake > 0) { const R = rand(Math.floor(t * 60)); ctx.translate((R() - 0.5) * 24 * shake, (R() - 0.5) * 24 * shake); }
  // gentle zoom on every kick in the drops
  if (inDrop(t)) { const z = 1 + pulse(t, 10) * 0.012; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2); }
  if (t < b2t(4)) sHook(t);
  else if (t < b2t(6)) sLogo(t);
  else if (t < b2t(28)) { const i = Math.floor((t - b2t(6)) / (2 * BAR)); FEATURES[i](t, b2t(6 + i * 2)); }
  else sOutro(t);
  ctx.restore();
  // transitions
  for (let b = 6; b <= 28; b += 2) wipe(t, b2t(b));
  // white flash on drops
  for (const hit of [b2t(4), b2t(18), b2t(28), b2t(31, 2)]) { const f = prog(t, hit, hit + 0.3); if (t >= hit && f < 1) { ctx.fillStyle = `rgba(255,255,255,${0.85 * (1 - f)})`; ctx.fillRect(0, 0, W, H); } }
  // progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, H - 8, W, 8); ctx.fillStyle = GOLD; ctx.fillRect(0, H - 8, W * clamp(t / (32 * BAR)), 8);
  // fade out at the very end
  const fo = prog(t, 32 * BAR + 0.4, 32 * BAR + 2.2); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
};
