# Builds the Windows installer and the two Mac apps (Apple Silicon and Intel).
# It runs on every push to main, or from the Actions tab with "Run workflow".
# The files land under Artifacts on the run's page.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Photo Editor for Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the Apple Silicon app
        run: npx tauri build --target aarch64-apple-darwin
      - name: Build the Intel app
        run: npx tauri build --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Photo Editor for Mac
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
